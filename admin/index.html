<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="theme-color" content="#f6f3ee" />
    <title>飞鸟旅行后台</title>
    <script type="module" crossorigin src="./assets/index-QFqF7OgU.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/cloudbase-C183mGQ9.js">
    <link rel="stylesheet" crossorigin href="./assets/index-i1GaWzfw.css">
  </head>
  <body>
    <div class="login-shell" id="loginScreen">
      <div class="login-visual" aria-hidden="true">
        <div class="visual-orbit orbit-one"></div>
        <div class="visual-orbit orbit-two"></div>
        <div class="visual-wordmark">
          <span>ASUKA</span>
          <strong>让每一段旅程，<br />都被认真讲述。</strong>
        </div>
      </div>
      <main class="login-card">
        <div class="brand-lockup">
          <span class="brand-mark">飛</span>
          <span><strong>飞鸟旅行</strong><small>ASUKA TRAVEL · CONTENT STUDIO</small></span>
        </div>
        <div class="login-copy">
          <p class="eyebrow">STAFF SIGN IN</p>
          <h1>欢迎回来</h1>
          <p>使用已获授权的工作邮箱登录。验证码只用于确认身份，无需另外记密码。</p>
        </div>
        <form id="loginForm" class="login-form">
          <label for="loginEmail">工作邮箱</label>
          <div class="email-row">
            <input id="loginEmail" type="email" autocomplete="email" placeholder="name@example.com" required />
            <button id="sendCodeButton" type="button">发送验证码</button>
          </div>
          <div class="code-field" id="codeField" hidden>
            <label for="loginCode">6位验证码</label>
            <input id="loginCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" />
          </div>
          <button class="primary login-submit" id="loginButton" type="submit" disabled>进入后台</button>
          <p class="form-message" id="loginMessage" role="status"></p>
        </form>
        <p class="login-security"><span aria-hidden="true">●</span> 工作人员身份由腾讯云 CloudBase 验证</p>
      </main>
    </div>

    <div class="cms-shell" id="cmsApp" hidden>
      <aside class="cms-sidebar">
        <div class="brand-lockup brand-lockup--sidebar">
          <span class="brand-mark">飛</span>
          <span><strong>飞鸟旅行</strong><small>CONTENT STUDIO</small></span>
        </div>
        <nav class="cms-nav" aria-label="后台功能">
          <button class="nav-item active" data-tab="overview"><span>01</span>产品概览</button>
          <button class="nav-item" data-tab="days"><span>02</span>每日行程</button>
          <button class="nav-item" data-tab="highlights"><span>03</span>亮点与图片</button>
          <button class="nav-item" data-tab="stays"><span>04</span>酒店与说明</button>
          <button class="nav-item" data-tab="publish"><span>05</span>发布管理</button>
          <button class="nav-item admin-only" data-tab="staff"><span>06</span>工作人员</button>
        </nav>
        <div class="sidebar-foot">
          <a href="https://z2816372267-dev.github.io/japan-signature-journeys/" target="_blank" rel="noopener">打开官网 ↗</a>
          <button id="signOutButton" type="button">退出登录</button>
        </div>
      </aside>

      <div class="cms-main">
        <header class="cms-topbar">
          <button class="mobile-menu" id="mobileMenu" type="button" aria-label="打开后台导航">☰</button>
          <div>
            <p id="sectionEyebrow">JOURNEY CONTENT</p>
            <h1 id="sectionTitle">产品概览</h1>
          </div>
          <div class="topbar-actions">
            <span class="save-state" id="saveState"><i></i>内容已同步</span>
            <button class="secondary" id="saveButton" type="button">保存草稿</button>
            <button class="primary admin-only" id="quickPublishButton" type="button">发布官网</button>
            <button class="profile-chip" id="profileButton" type="button" aria-label="当前账号">
              <span id="profileInitial">A</span>
              <span><strong id="profileName">工作人员</strong><small id="profileRole">编辑</small></span>
            </button>
          </div>
        </header>

        <div class="workspace">
          <main class="editor-canvas" id="editorCanvas">
            <div class="editor-loading" id="editorLoading"><span></span><p>正在读取最新行程内容…</p></div>
          </main>
          <aside class="preview-panel" id="previewPanel">
            <div class="preview-toolbar">
              <div><small>LIVE PREVIEW</small><strong>实时预览</strong></div>
              <div class="device-switch" role="group" aria-label="预览尺寸">
                <button class="active" data-device="desktop" type="button" aria-label="桌面预览">桌面</button>
                <button data-device="mobile" type="button" aria-label="手机预览">手机</button>
              </div>
            </div>
            <div class="preview-stage">
              <div class="journey-preview" id="journeyPreview"></div>
            </div>
          </aside>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" id="modalClose" type="button" aria-label="关闭">×</button>
        <div id="modalContent"></div>
      </section>
    </div>

    <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  </body>
</html>
